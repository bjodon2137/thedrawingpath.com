<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Antonica Codex — Named Mob Loot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --void:#0b0f0d;
  --stone:#141c18;
  --stone-2:#1c2621;
  --bone:#d8cba9;
  --bone-dim:#a89a78;
  --bronze:#b08a4e;
  --accent: #6f9c6a;
  --accent-2: #c2513f;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--void);color:var(--bone);font-family:'Spectral',serif;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}

/* ---------- ZONE TABS ---------- */
.zone-tabs{
  display:flex; gap:0; border-bottom:1px solid rgba(216,203,169,0.12);
  background:var(--void); position:sticky; top:0; z-index:20;
}
.zone-tab{
  flex:1; text-align:center; padding:18px 12px;
  font-family:'Cinzel',serif; font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--bone-dim); cursor:pointer; border-bottom:3px solid transparent;
  transition:all .2s; background:none; border-top:none; border-left:none; border-right:none;
}
.zone-tab small{display:block; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:none; opacity:.7; margin-top:4px;}
.zone-tab:hover{color:var(--bone);}
.zone-tab.active{color:var(--bone); border-bottom-color:var(--accent);}

/* ---------- HERO ---------- */
.hero{
  position:relative; padding:56px 24px 44px; overflow:hidden;
  border-bottom:1px solid rgba(216,203,169,0.12);
  background: radial-gradient(ellipse 800px 380px at 30% -10%, rgba(111,156,106,0.08), transparent 60%), var(--void);
  transition:background .3s;
}
.hero-inner{max-width:1180px;margin:0 auto;position:relative;z-index:2;}
.eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--bronze); display:flex; align-items:center; gap:10px; margin-bottom:18px;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--bronze);}
h1{
  font-family:'Cinzel',serif; font-weight:900; font-size:clamp(32px,5.2vw,58px); line-height:1.0;
  margin:0 0 14px; letter-spacing:.01em; color:var(--bone);
}
.sub{font-size:16px; color:var(--bone-dim); max-width:600px; line-height:1.6; font-style:italic;}
.stats-row{display:flex; gap:14px; margin-top:26px; flex-wrap:wrap;}
.stat-chip{
  font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--bone-dim);
  border:1px solid rgba(216,203,169,0.18); background:rgba(255,255,255,0.02);
  padding:8px 14px; border-radius:3px;
}
.stat-chip b{color:var(--bone);}

/* ---------- REGION LEGEND ---------- */
.legend{display:flex; flex-wrap:wrap; gap:1px; background:rgba(216,203,169,0.1);}
.legend-item{padding:18px 24px; background:var(--void); flex:1; min-width:200px;}
.legend-item h3{font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; margin:0 0 6px;}
.legend-item p{margin:0; font-size:12.5px; color:var(--bone-dim); line-height:1.5;}

/* ---------- CONTROLS ---------- */
.controls{
  display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  padding:26px 0 20px;
}
.search-box{flex:1 1 260px; position:relative;}
.search-box input{
  width:100%; background:var(--stone); border:1px solid rgba(216,203,169,0.16); color:var(--bone);
  font-family:'Spectral',serif; font-size:14.5px; padding:12px 16px 12px 38px; border-radius:3px; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-box input:focus{border-color:var(--bronze); box-shadow:0 0 0 3px rgba(176,138,78,0.15);}
.search-box::before{content:"⚲"; position:absolute; left:14px; top:50%; transform:translateY(-50%) rotate(90deg); color:var(--bone-dim); font-size:14px;}
.pill-group{display:flex; gap:6px; flex-wrap:wrap;}
.pill{
  font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.04em; padding:9px 14px; border-radius:20px;
  border:1px solid rgba(216,203,169,0.18); background:transparent; color:var(--bone-dim); cursor:pointer;
  transition:all .15s; text-transform:uppercase;
}
.pill:hover{border-color:var(--bronze); color:var(--bone);}
.pill.active{background:var(--bronze); color:var(--void); border-color:var(--bronze); font-weight:600;}
.count{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--bone-dim); margin-left:auto; white-space:nowrap;}

/* ---------- CARDS ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px;}
.card{
  position:relative; background:var(--stone); border:1px solid rgba(216,203,169,0.10); border-radius:4px;
  padding:20px 20px 18px; transition:transform .18s ease, background .18s ease; cursor:default;
}
.card:hover{transform:translateY(-2px); background:var(--stone-2);}
.card.hidden{display:none;}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
.card-name{font-family:'Cinzel',serif; font-weight:700; font-size:16px; color:var(--bone); line-height:1.25;}
.card-meta{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--bone-dim); white-space:nowrap; padding-top:3px;}
.region-badge{
  display:inline-block; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 8px; border-radius:2px; margin-bottom:8px;
}
.card-loc{font-size:12.5px; color:var(--bone-dim); margin-bottom:14px; font-style:italic;}
.drops{display:flex; flex-direction:column; gap:8px;}
.drop-row{display:flex; align-items:baseline; gap:8px; font-size:13px; padding:8px 10px; border-radius:3px; background:rgba(255,255,255,0.02); transition:opacity .2s;}
.drop-row.found{opacity:.4;}
.drop-row.found .drop-item{text-decoration:line-through;}
.drop-check{appearance:none; -webkit-appearance:none; width:15px; height:15px; flex-shrink:0; margin-top:1px; border:1px solid rgba(216,203,169,0.35); border-radius:3px; background:transparent; cursor:pointer; position:relative; transition:all .15s;}
.drop-check:checked{background:var(--bronze); border-color:var(--bronze);}
.drop-check:checked::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--void); font-weight:700;}
.drop-tag{font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:2px; flex-shrink:0;}
.drop-tag.common{color:#6f9c6a; border:1px solid rgba(111,156,106,0.4);}
.drop-tag.rare{color:#c2513f; border:1px solid rgba(194,81,63,0.45); box-shadow:0 0 14px rgba(194,81,63,0.3);}
.drop-item{color:var(--bone); line-height:1.4;}
.drop-stats{display:block; color:var(--bone-dim); font-size:11.5px; margin-top:2px;}
.empty-state{grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--bone-dim); font-style:italic; font-size:15px;}
.zone-badge{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:2px; margin-bottom:8px; margin-right:6px; background:rgba(176,138,78,0.15); color:var(--bronze); border:1px solid rgba(176,138,78,0.4); cursor:pointer;}
.zone-badge:hover{background:rgba(176,138,78,0.28);}
.global-toggle{display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--bone-dim); cursor:pointer; padding:9px 14px; border:1px solid rgba(216,203,169,0.18); border-radius:20px; user-select:none; transition:all .15s;}
.global-toggle:hover{border-color:var(--bronze);}
.global-toggle.active{background:var(--bronze); color:var(--void); border-color:var(--bronze); font-weight:600;}
.global-toggle input{display:none;}
.tracker-chip{cursor:pointer;}
.tracker-chip:hover{border-color:var(--bronze);}
footer{margin-top:50px; padding-top:24px; border-top:1px solid rgba(216,203,169,0.1); font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--bone-dim); line-height:1.7; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
.reset-btn{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--bone-dim); background:none; border:1px solid rgba(216,203,169,0.18); padding:7px 12px; border-radius:3px; cursor:pointer; text-transform:uppercase; letter-spacing:.05em;}
.reset-btn:hover{border-color:var(--accent-2); color:var(--accent-2);}
</style>
</head>

      {name:"Barnacle Bones", region:"waters", cls:"Skeleton Warrior", lvl:"16", loc:"15% @ (8,-456), 15% @ (-293,-1336)", common:{name:"Barnacle-covered Pauldron", stats:"—"}, rare:{name:"Coral Trident", stats:"—"}},

      {name:"Dwigus Lowater", region:"goblincamp", cls:"Goblin Warrior", lvl:"36", loc:"(-558, -463) / (-898, -627), placeholder is a Scalded Rat", common:{name:"Cauldron Prawn / Hunting Bow", stats:"—"}, rare:{name:"Ingot of the Constant", stats:"—"}},
      {name:"Aqua goblin tidal lord", region:"goblincamp", cls:"Goblin Warrior", lvl:"22-24", loc:"Spawns and roams throughout the zone", common:{name:"Arrow", stats:"—"}, rare:{name:"Cauldron Shell", stats:"—"}},

let currentZone = 'lguk';
let activeRegion = 'all';
let activeClass = 'all';
let globalSearchMode = false;

const LOOT_KEY = 'eql-loot-tracker-v1';
let lootData = {};
try{ lootData = JSON.parse(localStorage.getItem(LOOT_KEY) || '{}'); }catch(e){ lootData = {}; }

function lootKey(zoneKey, mobName, dropName){
  return zoneKey+'::'+mobName+'::'+dropName;
}
function isLooted(zoneKey, mobName, dropName){
  return !!lootData[lootKey(zoneKey, mobName, dropName)];
}
function toggleLoot(zoneKey, mobName, dropName, rowEl){
  const key = lootKey(zoneKey, mobName, dropName);
  lootData[key] = !lootData[key];
  if(!lootData[key]) delete lootData[key];
  try{ localStorage.setItem(LOOT_KEY, JSON.stringify(lootData)); }catch(e){}
  if(rowEl) rowEl.classList.toggle('found', !!lootData[key]);
  updateTrackedCount();
}
function updateTrackedCount(){
  const el = document.getElementById('trackedCount');
  if(el) el.textContent = Object.keys(lootData).length;
}

const zoneTabs = document.getElementById('zoneTabs');
Object.keys(ZONES).forEach(key=>{
  const z = ZONES[key];
  const b = document.createElement('button');
  b.className = 'zone-tab' + (key===currentZone ? ' active':'');
  b.innerHTML = `${z.label}<small>${z.mobs.length} named spawns</small>`;
  b.onclick = ()=>{ currentZone=key; activeRegion='all'; activeClass='all'; document.getElementById('search').value=''; renderZone(); };
  b.dataset.key = key;
  zoneTabs.appendChild(b);
});

function classBucket(cls){
  const c = cls.toLowerCase();
  if(c.includes('cleric')) return 'Cleric';
  if(c.includes('paladin')) return 'Paladin';
  if(c.includes('shadow knight')) return 'SK';
  if(c.includes('shaman')) return 'Shaman';
  if(c.includes('wizard')) return 'Wizard';
  if(c.includes('necromancer')) return 'Necro';
  if(c.includes('enchanter')) return 'Enchanter';
  if(c.includes('rogue')) return 'Rogue';
  if(c.includes('ranger')) return 'Ranger';
  if(c.includes('monk')) return 'Monk';
  if(c.includes('magician')) return 'Magician';
  if(c.includes('warrior')) return 'Warrior';
  return 'Other';
}

function dropRow(tag,drop,zoneKey,mobName){
  if(!drop) return '';
  const found = isLooted(zoneKey, mobName, drop.name);
  const safeZone = zoneKey.replace(/'/g,"\\'");
  const safeMob = mobName.replace(/'/g,"\\'");
  const safeDrop = drop.name.replace(/'/g,"\\'");
  return `<div class="drop-row${found?' found':''}">
    <input type="checkbox" class="drop-check" ${found?'checked':''} onclick="toggleLoot('${safeZone}','${safeMob}','${safeDrop}', this.closest('.drop-row'))" title="Mark as found" />
    <span class="drop-tag ${tag}">${tag}</span>
    <span><span class="drop-item">${drop.name}</span><span class="drop-stats">${drop.stats||''}</span></span>
  </div>`;
}

function renderZone(){
  const zone = ZONES[currentZone];

  // tabs
  [...zoneTabs.children].forEach(t=>t.classList.toggle('active', t.dataset.key===currentZone));

  // hero
  document.getElementById('zoneEyebrow').textContent = zone.eyebrow;
  document.getElementById('zoneTitle').textContent = zone.title;
  document.getElementById('zoneSub').textContent = zone.sub;
  document.getElementById('zoneLevels').textContent = zone.levels;
  document.getElementById('zoneRespawn').textContent = zone.respawn;
  document.getElementById('totalCount').textContent = zone.mobs.length;

  // legend
  const legend = document.getElementById('legend');
  legend.innerHTML='';
  zone.legend.forEach(l=>{
    const div = document.createElement('div');
    div.className='legend-item';
    div.style.borderTop = `2px solid ${l.color}`;
    div.innerHTML = `<h3 style="color:${l.color}">${l.label}</h3><p>${l.text}</p>`;
    legend.appendChild(div);
  });

  // region filters
  const regionFilters = document.getElementById('regionFilters');
  regionFilters.innerHTML='';
  const allBtn = document.createElement('button');
  allBtn.className='pill active'; allBtn.textContent='All Regions'; allBtn.dataset.val='all';
  allBtn.onclick=()=>{activeRegion='all'; syncPills(regionFilters,'all'); renderCards();};
  regionFilters.appendChild(allBtn);
  Object.keys(zone.regions).forEach(key=>{
    const r = zone.regions[key];
    const b = document.createElement('button');
    b.className='pill'; b.textContent=r.label; b.dataset.val=key;
    b.onclick=()=>{activeRegion=key; syncPills(regionFilters,key); renderCards();};
    regionFilters.appendChild(b);
  });

  // class filters
  const classFilters = document.getElementById('classFilters');
  classFilters.innerHTML='';
  const allClassBtn = document.createElement('button');
  allClassBtn.className='pill active'; allClassBtn.textContent='All Roles'; allClassBtn.dataset.val='all';
  allClassBtn.onclick=()=>{activeClass='all'; syncPills(classFilters,'all'); renderCards();};
  classFilters.appendChild(allClassBtn);
  const classSet = [...new Set(zone.mobs.map(m=>classBucket(m.cls)))];
  classSet.forEach(val=>{
    const b=document.createElement('button');
    b.className='pill'; b.textContent=val; b.dataset.val=val;
    b.onclick=()=>{activeClass=val; syncPills(classFilters,val); renderCards();};
    classFilters.appendChild(b);
  });

  renderCards();
}

function syncPills(container,val){
  [...container.children].forEach(b=>b.classList.toggle('active', b.dataset.val===val));
}

function buildCard(m, zoneKey, zone, showZoneBadge){
  const regionInfo = zone.regions[m.region];
  const card=document.createElement('div');
  card.className='card';
  card.style.borderLeft = `3px solid ${regionInfo.color}`;
  card.innerHTML=`
    <div class="card-top">
      <div class="card-name">${m.name}</div>
      <div class="card-meta">LVL ${m.lvl}</div>
    </div>
    ${showZoneBadge ? `<span class="zone-badge" data-jump="${zoneKey}">${zone.short}</span>` : ''}
    <div class="region-badge" style="color:${regionInfo.color}; border:1px solid ${regionInfo.color}66;">${regionInfo.label}</div>
    <div class="card-loc">${m.cls} · ${m.loc}</div>
    <div class="drops">
      ${dropRow('common', m.common, zoneKey, m.name)}
      ${dropRow('rare', m.rare, zoneKey, m.name)}
    </div>`;
  return card;
}

function renderCards(){
  const grid = document.getElementById('grid');
  const q = document.getElementById('search').value.trim().toLowerCase();

  if(globalSearchMode){
    grid.innerHTML='';
    let shown=0, total=0;
    if(!q){
      grid.innerHTML = `<div class="empty-state">Type a mob or item name to search across all 16 zones.</div>`;
      document.getElementById('resultCount').textContent = `Search all zones`;
      return;
    }
    Object.keys(ZONES).forEach(zoneKey=>{
      const zone = ZONES[zoneKey];
      zone.mobs.forEach(m=>{
        total++;
        const haystack = (m.name+' '+m.cls+' '+m.loc+' '+(m.common?m.common.name:'')+' '+(m.rare?m.rare.name:'')).toLowerCase();
        if(haystack.includes(q)){
          shown++;
          grid.appendChild(buildCard(m, zoneKey, zone, true));
        }
      });
    });
    if(shown===0){
      grid.innerHTML = `<div class="empty-state">No spawns match "${q}" in any zone.</div>`;
    } else {
      [...grid.querySelectorAll('.zone-badge')].forEach(b=>{
        b.onclick = ()=>{
          currentZone = b.dataset.jump;
          globalSearchMode = false;
          document.getElementById('globalSearchChk').checked = false;
          document.getElementById('globalToggle').classList.remove('active');
          renderZone();
          window.scrollTo({top:0, behavior:'smooth'});
        };
      });
    }
    document.getElementById('resultCount').textContent = `${shown} of ${total} spawns across all zones`;
    return;
  }

  const zone = ZONES[currentZone];
  grid.innerHTML='';
  let shown=0;
  zone.mobs.forEach(m=>{
    const bucket = classBucket(m.cls);
    const matchesRegion = activeRegion==='all' || m.region===activeRegion;
    const matchesClass = activeClass==='all' || bucket===activeClass;
    const haystack = (m.name+' '+m.cls+' '+m.loc+' '+(m.common?m.common.name:'')+' '+(m.rare?m.rare.name:'')).toLowerCase();
    const matchesSearch = !q || haystack.includes(q);
    if(matchesRegion && matchesClass && matchesSearch){
      shown++;
      grid.appendChild(buildCard(m, currentZone, zone, false));
    }
  });
  if(shown===0){
    grid.innerHTML = `<div class="empty-state">No spawns match that search. Try clearing filters.</div>`;
  }
  document.getElementById('resultCount').textContent = `${shown} of ${zone.mobs.length} spawns`;
}

document.getElementById('search').addEventListener('input', renderCards);
document.getElementById('globalSearchChk').addEventListener('change', function(){
  globalSearchMode = this.checked;
  document.getElementById('globalToggle').classList.toggle('active', globalSearchMode);
  document.getElementById('regionFilters').style.display = globalSearchMode ? 'none' : 'flex';
  document.getElementById('classFilters').style.display = globalSearchMode ? 'none' : 'flex';
  renderCards();
});
document.getElementById('resetTracker').addEventListener('click', function(){
  if(confirm('Clear all tracked/found loot across every zone? This cannot be undone.')){
    lootData = {};
    try{ localStorage.setItem(LOOT_KEY, JSON.stringify(lootData)); }catch(e){}
    updateTrackedCount();
    renderZone();
  }
});

updateTrackedCount();
renderZone();
</script>
